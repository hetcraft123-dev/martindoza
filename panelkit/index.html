<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <title>Mi Tablero</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-hover: #1a1a1e;
            --text-primary: #e8e8e8;
            --text-secondary: #6b6b70;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --accent-secondary: #00cec9;
            --success: #00c853;
            --warning: #ff9100;
            --danger: #ff5252;
            --border: #252529;
            --daily-color: #fdcb6e;
            --daily-glow: rgba(253, 203, 110, 0.18);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px 20px 60px;
            background-image:
                radial-gradient(ellipse at top, rgba(108, 92, 231, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 206, 201, 0.04) 0%, transparent 40%);
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
        }

        /* ── Loading ── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.4s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-top: 8px;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .patient-display-name {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 6px;
        }

        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.62rem;
            color: var(--text-secondary);
            margin-top: 10px;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-radius: 20px;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            transition: background 0.3s;
        }

        .sync-dot.syncing {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* ── Error screen ── */
        .error-screen {
            text-align: center;
            padding: 80px 20px;
            display: none;
        }

        .error-screen.show { display: block; }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .error-text {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* ── Section ── */
        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
        }

        /* ── Stats ── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* ── Phrase ── */
        .phrase-card {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.12), rgba(0, 206, 201, 0.08));
            border: 1px solid rgba(108, 92, 231, 0.3);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 20px;
            font-style: italic;
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
            text-align: center;
        }

        /* ── Daily Routine ── */
        .daily-section {
            border-color: rgba(253, 203, 110, 0.25);
            background: linear-gradient(135deg, rgba(253, 203, 110, 0.05) 0%, var(--bg-secondary) 60%);
        }

        .daily-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .daily-title {
            color: var(--daily-color) !important;
        }

        .daily-date-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Progress */
        .daily-progress-wrap {
            margin-bottom: 16px;
        }

        .daily-progress-track {
            width: 100%;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .daily-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--daily-color), #e17055);
            border-radius: 10px;
            transition: width 0.4s ease;
            width: 0%;
        }

        .daily-progress-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-align: right;
        }

        /* Task items */
        .routine-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .routine-task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }

        .routine-task:hover {
            border-color: var(--daily-color);
            background: rgba(253, 203, 110, 0.05);
        }

        .routine-task.done {
            opacity: 0.45;
            border-color: var(--border);
        }

        .routine-task.done:hover {
            opacity: 0.6;
            border-color: var(--border);
            background: var(--bg-primary);
        }

        .routine-check {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--bg-primary);
            transition: all 0.2s ease;
        }

        .routine-check.checked {
            background: var(--daily-color);
            border-color: var(--daily-color);
        }

        .routine-task-text {
            flex: 1;
            font-size: 0.9rem;
            line-height: 1.3;
            transition: all 0.2s;
        }

        .routine-task.done .routine-task-text {
            text-decoration: line-through;
        }

        .routine-task-delete {
            flex-shrink: 0;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.15s;
            line-height: 1;
        }

        .routine-task:hover .routine-task-delete {
            opacity: 1;
        }

        .routine-task-delete:hover {
            color: var(--danger);
            background: rgba(255, 82, 82, 0.1);
            transform: none;
            box-shadow: none;
        }

        .routine-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        /* Add task row */
        .daily-add-row {
            display: flex;
            gap: 10px;
        }

        .daily-add-row input {
            flex: 1;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            padding: 10px 14px;
            outline: none;
            transition: all 0.2s;
        }

        .daily-add-row input::placeholder {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .daily-add-row input:focus {
            border-color: var(--daily-color);
            box-shadow: 0 0 0 3px var(--daily-glow);
        }

        .daily-add-row button {
            background: var(--daily-color);
            border: none;
            border-radius: 8px;
            color: #0a0a0b;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            padding: 10px 18px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
        }

        .daily-add-row button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px var(--daily-glow);
        }

        .daily-add-row button:active {
            transform: scale(0.97);
        }

        /* ── Category Filters ── */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .filter-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            padding: 6px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            transform: none;
            box-shadow: none;
        }

        .filter-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 2px 10px var(--accent-glow);
        }

        /* ── Cards Grid ── */
        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .thought-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .thought-card:hover {
            border-color: rgba(108, 92, 231, 0.4);
        }

        .thought-card.priority-alta {
            border-left: 3px solid var(--danger);
        }

        .thought-card.priority-media {
            border-left: 3px solid var(--warning);
        }

        .thought-card.priority-baja {
            border-left: 3px solid var(--success);
        }

        .thought-card.read {
            opacity: 0.55;
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .priority-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .priority-dot.alta { background: var(--danger); }
        .priority-dot.media { background: var(--warning); }
        .priority-dot.baja { background: var(--success); }

        .cat-tag {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .cat-tag.cuerpo      { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .cat-tag.errores     { background: rgba(255, 145, 0, 0.2);   color: #ff9100; }
        .cat-tag.emociones   { background: rgba(0, 206, 201, 0.2);   color: #00cec9; }
        .cat-tag.relaciones  { background: rgba(108, 92, 231, 0.2);  color: #6c5ce7; }
        .cat-tag.autoestima  { background: rgba(253, 203, 110, 0.2); color: #fdcb6e; }
        .cat-tag.general     { background: rgba(99, 110, 114, 0.2);  color: #636e72; }

        .read-badge {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.58rem;
            color: var(--success);
            border: 1px solid rgba(0, 200, 83, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .card-text {
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .card-action {
            display: flex;
            justify-content: flex-end;
        }

        .read-btn {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            padding: 6px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .read-btn:hover {
            border-color: var(--success);
            color: var(--success);
            transform: none;
            box-shadow: none;
        }

        .read-btn.unread-btn:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        /* Empty states */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 2.5rem;
            opacity: 0.3;
            margin-bottom: 10px;
        }

        .empty-state-text {
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body { padding: 14px 14px 60px; }
            .stats-row { gap: 8px; }
            .stat-value { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="error-screen" id="errorScreen">
            <div class="error-icon">🔍</div>
            <p class="error-text">No se encontró este tablero.<br>Verifica el enlace.</p>
        </div>

        <div id="mainContent" style="display:none">

            <!-- Header -->
            <header class="header">
                <div class="logo">🧠 PanelKit</div>
                <div class="patient-display-name" id="patientDisplayName">…</div>
                <div class="sync-status">
                    <div class="sync-dot" id="syncDot"></div>
                    <span id="syncText">Conectando...</span>
                </div>
            </header>

            <!-- ── RUTINA DIARIA ── -->
            <div class="section daily-section">
                <div class="daily-header">
                    <div class="section-title daily-title">
                        <span>☀️</span>
                        Rutina de Hoy
                    </div>
                    <div class="daily-date-badge" id="dailyDateBadge">—</div>
                </div>

                <div class="daily-progress-wrap">
                    <div class="daily-progress-track">
                        <div class="daily-progress-fill" id="routineProgressFill"></div>
                    </div>
                    <div class="daily-progress-text" id="routineProgressText">0 / 0 completadas</div>
                </div>

                <div class="routine-list" id="routineList">
                    <div class="routine-empty">Agrega tareas a tu rutina diaria ↓</div>
                </div>

                <div class="daily-add-row">
                    <input type="text" id="routineInput" placeholder="+ Agregar tarea a mi rutina..." autocomplete="off" maxlength="120">
                    <button onclick="addRoutineTask()">+</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Tarjetas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statRead">0</div>
                    <div class="stat-label">Leídas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statPriority">0</div>
                    <div class="stat-label">Prioritarias</div>
                </div>
            </div>

            <!-- Motivational phrase -->
            <div class="phrase-card" id="phraseCard"></div>

            <!-- Cards section -->
            <div class="section">
                <div class="section-title">
                    <span>📝</span>
                    Mis Tarjetas
                </div>

                <div class="filter-row" id="filterRow"></div>
                <div class="cards-grid" id="cardsGrid"></div>
            </div>

        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
        import {
            getFirestore,
            collection, doc,
            getDoc, setDoc, deleteDoc, updateDoc,
            onSnapshot, query, orderBy
        } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

        // ── Firebase config ──────────────────────────────────────────────
        const firebaseConfig = {
            apiKey: "AIzaSyDetXdN-ujotpEY7HNJMQB2JEOYooLxpkk",
            authDomain: "todo-hetcraft.firebaseapp.com",
            projectId: "todo-hetcraft",
            storageBucket: "todo-hetcraft.firebasestorage.app",
            messagingSenderId: "225738970824",
            appId: "1:225738970824:web:f3a5c8432a9c3c6595f7fd"
        };

        const app = initializeApp(firebaseConfig);
        const db  = getFirestore(app);

        // ── Motivational phrases ─────────────────────────────────────────
        const PHRASES = [
            "Cada pequeño paso hacia adelante es una victoria. Estás haciendo más de lo que crees.",
            "Los pensamientos no son hechos. Puedes observarlos sin que te definan.",
            "Hoy no tiene que ser perfecto para ser valioso.",
            "Tu historia no termina en tu peor momento.",
            "Mereces el mismo cuidado que le das a los demás.",
            "El progreso no es lineal, y eso está bien.",
            "Respirar ya es un acto de valentía algunos días.",
            "No tienes que tenerlo todo resuelto hoy.",
            "Eres más fuerte que los pensamientos que intentan convencerte de lo contrario.",
            "Cada día que eliges seguir adelante es un acto de coraje.",
            "Tu mente puede mentirte; tu esfuerzo habla más fuerte que ella.",
            "Está bien pedir ayuda. Está bien no estar bien.",
            "Lo que sientes es válido. Y también puede cambiar.",
            "Eres un trabajo en progreso, y eso es suficiente.",
        ];

        // ── Slug desde URL ───────────────────────────────────────────────
        const slug = window.location.search.slice(1);

        // ── DOM refs ─────────────────────────────────────────────────────
        const loadingOverlay   = document.getElementById('loadingOverlay');
        const errorScreen      = document.getElementById('errorScreen');
        const mainContent      = document.getElementById('mainContent');
        const patientDisplayName = document.getElementById('patientDisplayName');
        const syncDot          = document.getElementById('syncDot');
        const syncText         = document.getElementById('syncText');
        const dailyDateBadge   = document.getElementById('dailyDateBadge');
        const routineProgressFill = document.getElementById('routineProgressFill');
        const routineProgressText = document.getElementById('routineProgressText');
        const routineList      = document.getElementById('routineList');
        const routineInput     = document.getElementById('routineInput');
        const statTotal        = document.getElementById('statTotal');
        const statRead         = document.getElementById('statRead');
        const statPriority     = document.getElementById('statPriority');
        const phraseCard       = document.getElementById('phraseCard');
        const filterRow        = document.getElementById('filterRow');
        const cardsGrid        = document.getElementById('cardsGrid');

        // ── State ────────────────────────────────────────────────────────
        let cards        = [];
        let routineTasks = [];
        let activeFilter = 'all';

        // ── Date helpers ─────────────────────────────────────────────────
        const TODAY = new Date().toISOString().split('T')[0]; // "2026-06-02"

        function formatDate(isoDate) {
            const [y, m, d] = isoDate.split('-');
            const months = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
            return `${d} ${months[parseInt(m) - 1]} ${y}`;
        }

        // ── Sync indicator ────────────────────────────────────────────────
        function setSyncing(on) {
            syncDot.className = 'sync-dot' + (on ? ' syncing' : '');
            syncText.textContent = on ? 'Guardando…' : 'Sincronizado';
        }

        // ── Escape HTML ───────────────────────────────────────────────────
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ── Daily state (localStorage, per-day) ──────────────────────────
        const DAILY_KEY = `routine_done_${slug}`;

        function getTodayDone() {
            try {
                const saved = JSON.parse(localStorage.getItem(DAILY_KEY) || '{}');
                if (saved.date !== TODAY) return [];   // new day → clean slate
                return Array.isArray(saved.ids) ? saved.ids : [];
            } catch { return []; }
        }

        function setTodayDone(ids) {
            localStorage.setItem(DAILY_KEY, JSON.stringify({ date: TODAY, ids }));
        }

        // ── Routine render ────────────────────────────────────────────────
        function renderRoutine() {
            const done    = getTodayDone();
            const validId = id => routineTasks.some(t => t.id === id);
            const doneFilt = done.filter(validId);
            const total   = routineTasks.length;
            const completed = doneFilt.length;

            // Progress bar
            const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
            routineProgressFill.style.width = pct + '%';
            routineProgressText.textContent = `${completed} / ${total} completadas`;

            // Sort: undone first, done last; preserve original order within each group
            const sorted = [...routineTasks].sort((a, b) => {
                const aDone = doneFilt.includes(a.id);
                const bDone = doneFilt.includes(b.id);
                if (aDone !== bDone) return aDone ? 1 : -1;
                return (a.createdAt || 0) - (b.createdAt || 0);
            });

            if (sorted.length === 0) {
                routineList.innerHTML = `<div class="routine-empty">Agrega tareas a tu rutina diaria ↓</div>`;
                return;
            }

            routineList.innerHTML = sorted.map(task => {
                const isDone = doneFilt.includes(task.id);
                return `
                    <div class="routine-task ${isDone ? 'done' : ''}" onclick="toggleRoutineTask('${task.id}')">
                        <div class="routine-check ${isDone ? 'checked' : ''}">${isDone ? '✓' : ''}</div>
                        <span class="routine-task-text">${escapeHtml(task.text)}</span>
                        <button class="routine-task-delete" onclick="deleteRoutineTask('${task.id}', event)" title="Eliminar de la rutina">✕</button>
                    </div>
                `;
            }).join('');
        }

        // ── Toggle task done ──────────────────────────────────────────────
        window.toggleRoutineTask = function(id) {
            const done = getTodayDone();
            const idx  = done.indexOf(id);
            if (idx === -1) done.push(id);
            else done.splice(idx, 1);
            setTodayDone(done);
            renderRoutine();
        };

        // ── Add routine task (persistent) ─────────────────────────────────
        window.addRoutineTask = async function() {
            const text = routineInput.value.trim();
            if (!text) { routineInput.focus(); return; }

            setSyncing(true);
            const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            await setDoc(doc(db, `panelkit_routine_${slug}`, id), {
                text,
                createdAt: Date.now()
            });
            routineInput.value = '';
            setSyncing(false);
        };

        // ── Delete routine task (removes from template + today's done) ────
        window.deleteRoutineTask = async function(id, event) {
            event.stopPropagation();
            setSyncing(true);
            await deleteDoc(doc(db, `panelkit_routine_${slug}`, id));
            const done = getTodayDone().filter(d => d !== id);
            setTodayDone(done);
            setSyncing(false);
        };

        // ── Listen to routine tasks (realtime) ────────────────────────────
        function listenRoutine() {
            const q = query(
                collection(db, `panelkit_routine_${slug}`),
                orderBy('createdAt', 'asc')
            );
            onSnapshot(q, snap => {
                routineTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderRoutine();
            });
        }

        // ── Cards render ──────────────────────────────────────────────────
        function renderCards() {
            const filtered = activeFilter === 'all'
                ? cards
                : cards.filter(c => c.category === activeFilter);

            // Unread first, then by priority
            const priorityOrder = { alta: 0, media: 1, baja: 2 };
            const sorted = [...filtered].sort((a, b) => {
                if (a.read !== b.read) return a.read ? 1 : -1;
                return (priorityOrder[a.priority] ?? 3) - (priorityOrder[b.priority] ?? 3);
            });

            if (sorted.length === 0) {
                cardsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p class="empty-state-text">${activeFilter === 'all' ? 'Sin tarjetas aún' : 'Nada en esta categoría'}</p>
                    </div>`;
                return;
            }

            cardsGrid.innerHTML = sorted.map(card => `
                <div class="thought-card priority-${card.priority} ${card.read ? 'read' : ''}" onclick="toggleRead('${card.id}', ${card.read})">
                    <div class="card-top">
                        <div class="priority-dot ${card.priority}"></div>
                        <span class="cat-tag ${card.category}">${card.category}</span>
                        ${card.read ? '<span class="read-badge">leído</span>' : ''}
                    </div>
                    <div class="card-text">${escapeHtml(card.text)}</div>
                    <div class="card-action">
                        <button class="read-btn ${card.read ? 'unread-btn' : ''}" onclick="toggleRead('${card.id}', ${card.read}); event.stopPropagation()">
                            ${card.read ? '↩ Marcar no leído' : '✓ Marcar leído'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ── Toggle read ───────────────────────────────────────────────────
        window.toggleRead = async function(cardId, currentRead) {
            setSyncing(true);
            await updateDoc(doc(db, `panelkit_cards_${slug}`, cardId), { read: !currentRead });
            setSyncing(false);
        };

        // ── Render filters ────────────────────────────────────────────────
        function renderFilters() {
            const categories = ['all', ...new Set(cards.map(c => c.category))];
            const labels = { all: 'Todas', cuerpo: 'Cuerpo', errores: 'Errores', emociones: 'Emociones', relaciones: 'Relaciones', autoestima: 'Autoestima', general: 'General' };
            filterRow.innerHTML = categories.map(cat => `
                <button class="filter-btn ${activeFilter === cat ? 'active' : ''}" onclick="setFilter('${cat}')">
                    ${labels[cat] || cat}
                </button>
            `).join('');
        }

        window.setFilter = function(cat) {
            activeFilter = cat;
            renderFilters();
            renderCards();
        };

        // ── Update stats ──────────────────────────────────────────────────
        function updateStats() {
            statTotal.textContent    = cards.length;
            statRead.textContent     = cards.filter(c => c.read).length;
            statPriority.textContent = cards.filter(c => c.priority === 'alta').length;
        }

        // ── Listen to cards ───────────────────────────────────────────────
        function listenCards() {
            const q = query(
                collection(db, `panelkit_cards_${slug}`),
                orderBy('createdAt', 'desc')
            );
            onSnapshot(q, snap => {
                cards = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                updateStats();
                renderFilters();
                renderCards();
                setSyncing(false);
            });
        }

        // ── Load patient ───────────────────────────────────────────────────
        async function loadPatient() {
            if (!slug) {
                showError();
                return;
            }

            try {
                const patientDoc = await getDoc(doc(db, 'panelkit_patients', slug));
                if (!patientDoc.exists()) {
                    showError();
                    return;
                }

                const patient = patientDoc.data();
                patientDisplayName.textContent = patient.name || slug;
                document.title = `${patient.name} — PanelKit`;

                // Date badge
                dailyDateBadge.textContent = formatDate(TODAY);

                // Motivational phrase (rotates daily)
                const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
                phraseCard.textContent = '"' + PHRASES[dayOfYear % PHRASES.length] + '"';

                // Show main content
                mainContent.style.display = 'block';
                setSyncing(false);

                // Start listeners
                listenRoutine();
                listenCards();

            } catch (err) {
                console.error(err);
                showError();
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        function showError() {
            loadingOverlay.classList.add('hidden');
            errorScreen.classList.add('show');
        }

        // ── Enter key on routine input ─────────────────────────────────────
        routineInput.addEventListener('keypress', e => {
            if (e.key === 'Enter') addRoutineTask();
        });

        // ── Init ───────────────────────────────────────────────────────────
        loadPatient();
    </script>
</body>
</html>
