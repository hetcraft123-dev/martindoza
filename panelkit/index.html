<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <title>PanelKit - Martin Doza</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-hover: #1a1a1e;
            --text-primary: #e8e8e8;
            --text-secondary: #6b6b70;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.3);
            --accent-secondary: #00cec9;
            --accent-secondary-glow: rgba(0, 206, 201, 0.3);
            --success: #00c853;
            --warning: #ff9100;
            --danger: #ff5252;
            --border: #252529;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
            background-image: 
                radial-gradient(ellipse at top, rgba(108, 92, 231, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 206, 201, 0.04) 0%, transparent 40%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 12px;
            padding: 4px 12px;
            background: var(--bg-secondary);
            border-radius: 20px;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .sync-dot.syncing {
            background: var(--warning);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Sections */
        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 1.2rem;
        }

        /* Form */
        .form-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .form-group {
            flex: 1;
        }

        .form-group.small {
            flex: 0 0 auto;
            min-width: 150px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input, select, textarea {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            padding: 12px 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        select {
            cursor: pointer;
        }

        button {
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        button.secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
            box-shadow: none;
        }

        button.danger {
            background: var(--danger);
        }

        button.success {
            background: var(--success);
        }

        /* Patients Grid */
        .patients-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .patient-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .patient-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .patient-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .patient-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: white;
        }

        .patient-info {
            flex: 1;
        }

        .patient-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .patient-id {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .patient-stats {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }

        .patient-stat {
            display: flex;
            flex-direction: column;
        }

        .patient-stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
        }

        .patient-stat-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .patient-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .patient-actions button {
            flex: 1;
            padding: 10px;
            font-size: 0.7rem;
        }

        /* Cards Preview */
        .cards-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .card-tag {
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        .card-tag.cuerpo { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .card-tag.errores { background: rgba(255, 145, 0, 0.2); color: #ff9100; }
        .card-tag.emociones { background: rgba(0, 206, 201, 0.2); color: #00cec9; }
        .card-tag.relaciones { background: rgba(108, 92, 231, 0.2); color: #6c5ce7; }
        .card-tag.autoestima { background: rgba(253, 203, 110, 0.2); color: #fdcb6e; }
        .card-tag.general { background: rgba(99, 110, 114, 0.2); color: #636e72; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-primary);
            transform: none;
            box-shadow: none;
        }

        /* Cards List in Modal */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .card-item {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .card-item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .card-priority {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .card-priority.alta { background: var(--danger); }
        .card-priority.media { background: var(--warning); }
        .card-priority.baja { background: var(--success); }

        .card-item-text {
            flex: 1;
            font-size: 0.9rem;
        }

        .card-item-actions {
            display: flex;
            gap: 6px;
        }

        .card-item-actions button {
            padding: 6px 10px;
            font-size: 0.65rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-text {
            font-size: 0.9rem;
        }

        /* Link Copy */
        .link-container {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .link-input {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            background: var(--bg-primary);
        }

        .copy-feedback {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 2000;
        }

        .copy-feedback.show {
            opacity: 1;
        }

        /* Loading */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }

            .form-group.small {
                min-width: 100%;
            }

            .patients-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="copy-feedback" id="copyFeedback">✓ Enlace copiado</div>

    <!-- Modal: Gestionar Tarjetas -->
    <div class="modal-overlay" id="cardsModal">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">📝 Tarjetas de <span id="modalPatientName"></span></div>
                <button class="modal-close" onclick="closeCardsModal()">×</button>
            </div>

            <!-- Add Card Form -->
            <div class="form-row">
                <div class="form-group">
                    <label>Pensamiento / Afirmación</label>
                    <textarea id="cardText" placeholder="Ej: Yo no soy mis errores, mis errores son oportunidades de aprendizaje..."></textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="cardCategory">
                        <option value="general">General</option>
                        <option value="cuerpo">Cuerpo</option>
                        <option value="errores">Errores</option>
                        <option value="emociones">Emociones</option>
                        <option value="relaciones">Relaciones</option>
                        <option value="autoestima">Autoestima</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Prioridad</label>
                    <select id="cardPriority">
                        <option value="alta">🔴 Alta</option>
                        <option value="media">🟡 Media</option>
                        <option value="baja">🟢 Baja</option>
                    </select>
                </div>
            </div>
            <button onclick="addCard()" style="width: 100%;">+ Agregar Tarjeta</button>

            <div class="cards-list" id="cardsList"></div>
        </div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">🧠 PanelKit</div>
            <p class="subtitle">Panel de gestión para terapeutas</p>
            <div class="sync-status">
                <div class="sync-dot" id="syncDot"></div>
                <span id="syncText">Conectando...</span>
            </div>
        </header>

        <!-- Create Patient -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">
                    <span class="section-icon">➕</span>
                    Nuevo Paciente
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Nombre del paciente</label>
                    <input type="text" id="patientName" placeholder="Ej: Rodrigo" autocomplete="off">
                </div>
                <div class="form-group small">
                    <label>Identificador</label>
                    <input type="text" id="patientId" placeholder="Ej: 1" autocomplete="off">
                </div>
            </div>
            <button onclick="createPatient()">Crear Paciente</button>
        </div>

        <!-- Patients List -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">
                    <span class="section-icon">👥</span>
                    Mis Pacientes
                </div>
                <span id="patientsCount" style="color: var(--text-secondary); font-size: 0.8rem;">0 pacientes</span>
            </div>
            <div class="patients-grid" id="patientsGrid"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDetXdN-ujotpEY7HNJMQB2JEOYooLxpkk",
            authDomain: "todo-hetcraft.firebaseapp.com",
            projectId: "todo-hetcraft",
            storageBucket: "todo-hetcraft.firebasestorage.app",
            messagingSenderId: "225738970824",
            appId: "1:225738970824:web:f3a5c8432a9c3c6595f7fd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State
        let patients = [];
        let currentPatientId = null;
        let currentPatientCards = [];

        const BASE_URL = 'https://hetcraft123-dev.github.io/martindoza/paciente/';

        // DOM
        const loadingOverlay = document.getElementById('loadingOverlay');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        const patientsGrid = document.getElementById('patientsGrid');
        const patientsCount = document.getElementById('patientsCount');
        const cardsModal = document.getElementById('cardsModal');
        const cardsList = document.getElementById('cardsList');
        const copyFeedback = document.getElementById('copyFeedback');

        function updateSyncStatus(status) {
            syncDot.className = 'sync-dot';
            if (status === 'online') {
                syncText.textContent = 'Sincronizado';
            } else if (status === 'syncing') {
                syncDot.classList.add('syncing');
                syncText.textContent = 'Sincronizando...';
            }
        }

        function generateSlug(name, id) {
            const cleanName = name.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
            return `${cleanName}-${id}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Create Patient
        window.createPatient = async function() {
            const nameInput = document.getElementById('patientName');
            const idInput = document.getElementById('patientId');
            const name = nameInput.value.trim();
            const id = idInput.value.trim() || Date.now().toString().slice(-4);

            if (!name) {
                nameInput.focus();
                return;
            }

            const slug = generateSlug(name, id);
            const patientData = {
                name,
                identifier: id,
                slug,
                createdAt: Date.now(),
                cardsCount: 0
            };

            updateSyncStatus('syncing');
            await setDoc(doc(db, 'panelkit_patients', slug), patientData);

            nameInput.value = '';
            idInput.value = '';
            updateSyncStatus('online');
        };

        // Delete Patient
        window.deletePatient = async function(slug) {
            if (!confirm('¿Eliminar este paciente y todas sus tarjetas?')) return;

            updateSyncStatus('syncing');
            
            // Delete all cards first
            const patient = patients.find(p => p.slug === slug);
            if (patient && patient.cards) {
                for (const card of patient.cards) {
                    await deleteDoc(doc(db, `panelkit_cards_${slug}`, card.id));
                }
            }
            
            await deleteDoc(doc(db, 'panelkit_patients', slug));
            updateSyncStatus('online');
        };

        // Copy Link
        window.copyPatientLink = function(slug) {
            const url = BASE_URL + slug;
            navigator.clipboard.writeText(url).then(() => {
                copyFeedback.classList.add('show');
                setTimeout(() => copyFeedback.classList.remove('show'), 2000);
            });
        };

        // Open Cards Modal
        window.openCardsModal = function(slug) {
            currentPatientId = slug;
            const patient = patients.find(p => p.slug === slug);
            document.getElementById('modalPatientName').textContent = patient?.name || slug;
            cardsModal.classList.add('show');
            
            // Listen to cards
            const q = query(collection(db, `panelkit_cards_${slug}`), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                currentPatientCards = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderCards();
            });
        };

        window.closeCardsModal = function() {
            cardsModal.classList.remove('show');
            currentPatientId = null;
        };

        // Add Card
        window.addCard = async function() {
            const text = document.getElementById('cardText').value.trim();
            const category = document.getElementById('cardCategory').value;
            const priority = document.getElementById('cardPriority').value;

            if (!text || !currentPatientId) return;

            const cardData = {
                text,
                category,
                priority,
                createdAt: Date.now(),
                read: false
            };

            updateSyncStatus('syncing');
            const cardId = Date.now().toString(36) + Math.random().toString(36).substr(2);
            await setDoc(doc(db, `panelkit_cards_${currentPatientId}`, cardId), cardData);

            // Update cards count
            const patient = patients.find(p => p.slug === currentPatientId);
            if (patient) {
                await setDoc(doc(db, 'panelkit_patients', currentPatientId), {
                    ...patient,
                    cardsCount: (patient.cardsCount || 0) + 1
                });
            }

            document.getElementById('cardText').value = '';
            updateSyncStatus('online');
        };

        // Delete Card
        window.deleteCard = async function(cardId) {
            if (!currentPatientId) return;

            updateSyncStatus('syncing');
            await deleteDoc(doc(db, `panelkit_cards_${currentPatientId}`, cardId));

            // Update cards count
            const patient = patients.find(p => p.slug === currentPatientId);
            if (patient) {
                await setDoc(doc(db, 'panelkit_patients', currentPatientId), {
                    ...patient,
                    cardsCount: Math.max((patient.cardsCount || 1) - 1, 0)
                });
            }

            updateSyncStatus('online');
        };

        // Render Cards
        function renderCards() {
            if (currentPatientCards.length === 0) {
                cardsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <p class="empty-text">Sin tarjetas aún</p>
                    </div>
                `;
                return;
            }

            cardsList.innerHTML = currentPatientCards.map(card => `
                <div class="card-item">
                    <div class="card-item-header">
                        <div class="card-priority ${card.priority}"></div>
                        <span class="card-tag ${card.category}">${card.category}</span>
                        <div class="card-item-actions">
                            <button class="danger" onclick="deleteCard('${card.id}')">✕</button>
                        </div>
                    </div>
                    <div class="card-item-text">${escapeHtml(card.text)}</div>
                </div>
            `).join('');
        }

        // Render Patients
        function renderPatients() {
            patientsCount.textContent = `${patients.length} paciente${patients.length !== 1 ? 's' : ''}`;

            if (patients.length === 0) {
                patientsGrid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">👥</div>
                        <p class="empty-text">No hay pacientes aún. ¡Crea el primero!</p>
                    </div>
                `;
                return;
            }

            patientsGrid.innerHTML = patients.map(patient => {
                const initial = patient.name.charAt(0).toUpperCase();
                const url = BASE_URL + patient.slug;
                
                return `
                    <div class="patient-card">
                        <div class="patient-header">
                            <div class="patient-avatar">${initial}</div>
                            <div class="patient-info">
                                <div class="patient-name">${escapeHtml(patient.name)}</div>
                                <div class="patient-id">#${patient.identifier}</div>
                            </div>
                        </div>
                        <div class="patient-stats">
                            <div class="patient-stat">
                                <span class="patient-stat-value">${patient.cardsCount || 0}</span>
                                <span class="patient-stat-label">Tarjetas</span>
                            </div>
                        </div>
                        <div class="link-container">
                            <input type="text" class="link-input" value="${url}" readonly onclick="this.select()">
                            <button class="secondary" onclick="copyPatientLink('${patient.slug}')">📋</button>
                        </div>
                        <div class="patient-actions">
                            <button onclick="openCardsModal('${patient.slug}')">📝 Tarjetas</button>
                            <button class="danger" onclick="deletePatient('${patient.slug}')">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Setup Listeners
        function setupListeners() {
            const q = query(collection(db, 'panelkit_patients'), orderBy('createdAt', 'desc'));
            onSnapshot(q, (snapshot) => {
                patients = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderPatients();
                updateSyncStatus('online');
            }, (error) => {
                console.error(error);
            });

            setTimeout(() => loadingOverlay.classList.add('hidden'), 500);
        }

        // Init
        setupListeners();

        // Close modal on overlay click
        cardsModal.addEventListener('click', (e) => {
            if (e.target === cardsModal) closeCardsModal();
        });

        // Enter key on inputs
        document.getElementById('patientName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('patientId').focus();
        });
        document.getElementById('patientId').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createPatient();
        });
    </script>
</body>
</html>
